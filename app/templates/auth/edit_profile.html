{% extends 'base.html' %}
{% from 'partials/macros.html' import field %}
{% block title %}Editar perfil{% endblock %}
{% block content %}
<div class="page-head"><h1>Editar perfil</h1></div>
<div class="card">
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    <div class="form-grid">
      {{ field(form.first_name) }}
      {{ field(form.last_name) }}
      <div class="full">{{ field(form.phone) }}</div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn" href="{{ url_for('auth.profile') }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
