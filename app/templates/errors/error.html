{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="auth-wrap">

    <p class="muted">Error {{ code }}</p>
    <h1>{{ title }}</h1>

  </div>
</div>
{% endblock %}
